name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "검사할 branch/tag/SHA. 비우면 실행 workflow의 ref"
        type: string
        default: ""
      build_image:
        description: "Docker 런타임 빌드 검사 (레지스트리 게시 없음)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 의존성이 허용하는 범위에서 시험을 돌려 본 판들이다(pyproject 의 requires-python 과 맞춘다).
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip freeze | grep -E '^(torch|torchvision)==' > /tmp/map-torch-constraints.txt
          python -m pip install -c /tmp/map-torch-constraints.txt -r requirements.txt -r requirements-dev.txt
          python -m pip check
      - name: import runtime
        run: python -c "import map_project_yolo.main"
      - name: test
        run: python -m pytest -q
      - name: build runtime image
        # 이미지는 Dockerfile 의 Python 판(3.12)과 같은 줄에서 한 번만 만든다.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_image && matrix.python-version == '3.12' }}
        run: docker build --tag map-runtime:ci .
      - name: check license notices in runtime image
        # 실행 단계의 작업 경로(/app)에 LICENSE·NOTICE 가 들어갔는지 본다. 이미지에는 AGPL-3.0 구성 요소가 함께 들어간다.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_image && matrix.python-version == '3.12' }}
        run: docker run --rm --network none --entrypoint sh map-runtime:ci -ec 'test -s /app/LICENSE && test -s /app/NOTICE'
